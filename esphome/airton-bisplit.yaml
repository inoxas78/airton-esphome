# =============================================================================
#  Airton bi-split / multi-split (protocole 7A 7A, module "ACW02") -> ESPHome
#  Le pilotage est assure par le composant devildant/acw02_esphome.
#  Ce package ajoute un decodeur passif des trames que le composant ignore,
#  pour recuperer le COMPTEUR D'ENERGIE de chaque unite interieure.
#  Documentation : docs/protocole-7a7a-bisplit.md
# =============================================================================

substitutions:
  lang: "fr"
  board: esp32dev        # ESP32 D1 mini (WROOM-32)
  acw02_ref: main

esphome:
  name: ${dev_name}
  friendly_name: ${dev_friendly}
  build_flags:
    - -DDLOCALE_LANG=\"${lang}\"
    - -DDBOARD=\"${board}\"

esp32:
  board: ${board}
  framework:
    type: esp-idf

web_server:
  port: 80
  version: 3
  log: true
  local: true
  include_internal: true

logger:
  level: INFO

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
  - platform: web_server

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: ${dev_friendly}

# Le composant ACW02 exige un bloc MQTT ; on le laisse desactive, l'integration
# Home Assistant passe par l'API ESPHome.
mqtt:
  broker: 192.168.1.10
  username: !secret mqtt_username
  password: !secret mqtt_password
  enable_on_boot: false
  discovery: false
  keepalive: 30s
  log_topic: null
  clean_session: false
  idf_send_async: false
  wait_for_connection: false
  topic_prefix: ${dev_name}
  birth_message:
    topic: ${dev_name}/status
    payload: online
  will_message:
    topic: ${dev_name}/status
    payload: offline

captive_portal:

uart:
  id: uart_acw02
  tx_pin: ${TX}
  rx_pin: ${RX}
  baud_rate: 9600
  stop_bits: 1
  rx_buffer_size: 1024
  # Decodeur passif des trames 18 et 34 octets (unite interieure D5 -> module 21) :
  #   trame 18 (cmd AC), octets 13-14 : compteur d'energie de l'unite (pas de 0,1 kWh)
  #   trame 18 (cmd AC), octets 10-11 : compteur horaire (+24 / jour)
  #   trame 34 (cmd A3), octets 21-22 : constante 0x0464 = 1124 sur toutes les unites
  debug:
    direction: RX
    dummy_receiver: false
    after:
      timeout: 15ms
    sequence:
      - lambda: |-
          size_t i = 0;
          while (i + 18 <= bytes.size()) {
            if (bytes[i] == 0x7A && bytes[i+1] == 0x7A && bytes[i+2] == 0xD5 && bytes[i+3] == 0x21) {
              uint8_t len = bytes[i+4];
              if (len == 0x12) {
                uint16_t e = (bytes[i+13] << 8) | bytes[i+14];
                id(trame18_a).publish_state((bytes[i+10] << 8) | bytes[i+11]);
                id(trame18_b).publish_state(e);
                // Puissance moyenne = 100 Wh / temps ecoule entre deux pas du compteur
                uint32_t now = millis();
                int32_t prev = id(g_last_e);
                if (prev < 0) {
                  id(g_last_t) = now;
                } else if (e > prev && (e - prev) < 50) {
                  if (id(g_inc_seen)) {
                    float dt_h = (now - id(g_last_t)) / 3600000.0f;
                    if (dt_h > 0.01f) id(clim_puissance).publish_state((e - prev) * 100.0f / dt_h);
                  }
                  id(g_inc_seen) = true;
                  id(g_last_t) = now;
                }
                id(g_last_e) = e;
                id(clim_energie).publish_state(e * 0.1f);
                i += 18;
                continue;
              }
              if (len == 0x22 && i + 34 <= bytes.size()) {
                id(trame34_c).publish_state((bytes[i+21] << 8) | bytes[i+22]);
                i += 34;
                continue;
              }
            }
            i++;
          }

external_components:
  - source:
      type: git
      url: https://github.com/devildant/acw02_esphome
      ref: ${acw02_ref}

packages:
  acw02_entities: github://devildant/acw02_esphome/components/acw02/acw02_fr.yaml@${acw02_ref}

acw02:
  id: ac_ctrl
  uart_id: uart_acw02

globals:
  - id: g_last_e
    type: int32_t
    initial_value: '-1'
  - id: g_last_t
    type: uint32_t
    initial_value: '0'
  - id: g_inc_seen
    type: bool
    initial_value: 'false'

# Sans nouveau pas du compteur, la puissance moyenne ne peut pas depasser 100 Wh / temps ecoule
interval:
  - interval: 60s
    then:
      - lambda: |-
          if (id(g_last_e) < 0) return;
          float dt_h = (millis() - id(g_last_t)) / 3600000.0f;
          if (dt_h < 0.25f) return;
          float plafond = dt_h > 2.0f ? 0.0f : 100.0f / dt_h;
          float p = id(clim_puissance).state;
          if (isnan(p) || plafond < p) id(clim_puissance).publish_state(plafond);

sensor:
  - platform: template
    id: clim_energie
    name: "Énergie consommée"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    icon: mdi:lightning-bolt
    filters:
      - delta: 0.05
  - platform: template
    id: clim_puissance
    name: "Puissance moyenne"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - delta: 5
  # Compteurs bruts (diagnostic)
  - platform: template
    id: trame18_a
    name: "Trame18 octets 10-11 (brut)"
    icon: mdi:counter
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    filters:
      - delta: 0.5
  - platform: template
    id: trame18_b
    name: "Trame18 octets 13-14 (brut)"
    icon: mdi:counter
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    filters:
      - delta: 0.5
  - platform: template
    id: trame34_c
    name: "Trame34 octets 21-22 (brut)"
    icon: mdi:counter
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    filters:
      - delta: 0.5
